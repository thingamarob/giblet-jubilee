<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5,000 Calories on Thanksgiving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140d08; --panel:#1f140c; --ink:#fff4e0; --dim:#b89a7a;
    --gold:#ffb627; --orange:#ff6b1a; --red:#e8452c; --line:#3a2616;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 20%, #2a1809 0%, var(--bg) 60%);
    color:var(--ink); font-family:"JetBrains Mono",ui-monospace,monospace;
    display:flex; flex-direction:column; min-height:100vh; overflow-x:hidden;
  }
  header{padding:18px 20px 0; text-align:center}
  .live{
    display:inline-flex; align-items:center; gap:8px; font-size:12px; letter-spacing:.25em;
    color:var(--gold); text-transform:uppercase; font-weight:700;
  }
  .dot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  h1{
    font-family:Anton,Impact,sans-serif; font-weight:400; letter-spacing:.04em;
    font-size:clamp(34px,7vw,72px); line-height:1; margin-top:8px; text-transform:uppercase;
  }
  h1 span{color:var(--orange)}
  .sub{color:var(--dim); font-size:clamp(11px,1.6vw,14px); letter-spacing:.18em; text-transform:uppercase; margin-top:8px}

  main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:18px}
  .label{font-size:clamp(12px,2vw,16px); letter-spacing:.35em; color:var(--dim); text-transform:uppercase}
  .counter{
    font-family:Anton,Impact,sans-serif; line-height:.9;
    font-size:clamp(110px,28vw,380px); color:var(--gold);
    text-shadow:0 0 40px rgba(255,150,30,.35), 0 6px 0 #7a3a08;
    font-variant-numeric:tabular-nums; letter-spacing:.01em;
  }
  .counter.done{color:#fff; animation:flash .8s infinite alternate}
  @keyframes flash{from{text-shadow:0 0 30px #ff6b1a,0 6px 0 #7a3a08}to{text-shadow:0 0 90px #ffb627,0 6px 0 #7a3a08}}
  .unit{font-family:Anton,Impact,sans-serif; font-size:clamp(20px,4vw,40px); letter-spacing:.3em; color:var(--orange); margin-top:-6px}

  .bar-wrap{width:min(920px,100%); margin-top:10px}
  .bar{position:relative; height:26px; background:var(--panel); border:2px solid var(--line); border-radius:4px; overflow:hidden}
  .fill{height:100%; width:0; background:linear-gradient(90deg,var(--orange),var(--gold)); transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .tick{position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,.55)}
  .bar-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--dim); margin-top:8px; letter-spacing:.08em}
  .status{
    font-family:Anton,Impact,sans-serif; letter-spacing:.14em; font-size:clamp(16px,2.6vw,26px);
    color:var(--ink); background:var(--panel); border:2px solid var(--line); padding:8px 18px; border-radius:4px; text-transform:uppercase;
  }
  .status b{color:var(--gold); font-weight:400}
  .countdown{font-size:clamp(12px,1.8vw,15px); color:var(--dim); letter-spacing:.2em; text-transform:uppercase; text-align:center}
  .countdown b{color:var(--gold)}

  /* ticker */
  .ticker{
    border-top:3px solid var(--orange); background:#0c0704; overflow:hidden; white-space:nowrap;
    display:flex; align-items:stretch; position:sticky; bottom:0;
  }
  .ticker-tag{
    flex:none; background:var(--orange); color:#140d08; font-family:Anton,Impact,sans-serif;
    letter-spacing:.12em; padding:14px 18px; font-size:16px; text-transform:uppercase; z-index:2;
  }
  .ticker-view{flex:1; overflow:hidden; position:relative}
  .ticker-track{display:inline-flex; padding:14px 0; animation:scroll var(--dur,40s) linear infinite; will-change:transform}
  .ticker:hover .ticker-track{animation-play-state:paused}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .item{padding:0 28px; font-size:clamp(13px,1.8vw,17px); font-weight:700; letter-spacing:.04em}
  .item i{font-style:normal; color:var(--dim); font-weight:500; margin-right:10px}
  .item em{font-style:normal; color:var(--gold)}
  .item::after{content:"✦"; color:var(--orange); margin-left:28px}
  @media (prefers-reduced-motion:reduce){.ticker-track{animation:none}.dot,.counter.done{animation:none}}

  footer{font-size:11px; color:#7a634b; text-align:center; padding:8px 12px; letter-spacing:.1em}
</style>
</head>
<body>
<header>
  <div class="live"><span class="dot"></span><span id="livetxt">Live Gluttony Tracking</span></div>
  <h1>1 day.<span>5000 calories.</span></h1>
  <div class="sub">It's more food than you'd think.</div>
</header>

<main id="root"></main>

<div class="ticker">
  <div class="ticker-tag">Just Ate</div>
  <div class="ticker-view"><div class="ticker-track" id="track"></div></div>
</div>
<footer>This is a great idea and an incredible accomplishment.</footer>

<script>
/* ============================================================
   EDIT THIS LIST DURING THE EVENT, THEN RE-UPLOAD THE FILE.
   One line per dish, oldest first. Example:
     {dish: "Turkey, 2 slices", cal: 320, time: "2:05 PM"},
     {dish: "Stuffing, heroic scoop", cal: 350, time: "2:11 PM"},
   ============================================================ */
var ENTRIES = [
];
</script>
<script>
(function(){
  var TARGET = 5000;
  var EVENT_DAY = new Date(2026, 10, 26, 0, 0, 0); // Thanksgiving, Nov 26 2026 (local time)
  var entries = ENTRIES;
  var total = entries.reduce(function(s,e){return s + (+e.cal||0)}, 0);

  function fmt(n){ return Math.round(n).toLocaleString('en-US'); }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}); }

  function statusFor(t){
    var p = t / TARGET;
    if (t === 0) return ['Pre-event','<b>Stretching.</b> Stomach lining loosened.'];
    if (p < .2)  return ['Warm-up','<b>Warming up.</b> Pacing is everything.'];
    if (p < .5)  return ['Early race','<b>Finding rhythm.</b> Belt still holding.'];
    if (p < .75) return ['Midrace','<b>Hitting stride.</b> Pie lane is open.'];
    if (p < .95) return ['The wall','<b>The wall.</b> This is where champions are made.'];
    if (p < 1)   return ['Final stretch','<b>So close.</b> One more roll. Just one.'];
    return ['Complete','<b>TARGET ACHIEVED.</b> History has been made.'];
  }

  function countdownText(){
    var now = new Date(), end = new Date(EVENT_DAY.getTime() + 24*3600*1000);
    if (now >= EVENT_DAY && now < end) return '<b>EVENT DAY.</b> Training is over. It is time.';
    if (now >= end) return 'The event has concluded. Final results are official.';
    var ms = EVENT_DAY - now, d = Math.floor(ms/86400000), h = Math.floor(ms%86400000/3600000);
    return 'Race day in <b>' + d + 'd ' + h + 'h</b> · Thanksgiving, Nov 26';
  }

  function render(){
    var root = document.getElementById('root');
    var st = statusFor(total);
    var pct = Math.min(100, total / TARGET * 100);
    var ticks = [25,50,75].map(function(p){return '<div class="tick" style="left:'+p+'%"></div>'}).join('');
    root.innerHTML =
      '<div class="label">Calories consumed</div>' +
      '<div><div class="counter'+(total>=TARGET?' done':'')+'" id="num">0</div><div class="unit" style="text-align:center">CALORIES</div></div>' +
      '<div class="status">'+st[1]+'</div>' +
      '<div class="bar-wrap"><div class="bar"><div class="fill" id="fill"></div>'+ticks+'</div>' +
        '<div class="bar-meta"><span>0</span><span id="togo"></span><span>'+fmt(TARGET)+'</span></div></div>' +
      '<div class="countdown" id="cd">'+countdownText()+'</div>';
    document.getElementById('togo').textContent = total >= TARGET ? (fmt(total-TARGET)+' over target') : (fmt(TARGET-total)+' to go');
    requestAnimationFrame(function(){ document.getElementById('fill').style.width = pct + '%'; });
    // count-up animation
    var el = document.getElementById('num'), start = performance.now(), dur = 1400;
    function step(t){
      var k = Math.min(1,(t-start)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = fmt(total*e);
      if (k<1) requestAnimationFrame(step); else el.textContent = fmt(total);
    }
    requestAnimationFrame(step);
  }

  function ago(t){ return t || ''; }

  function renderTicker(){
    var track = document.getElementById('track');
    var list = entries.slice().reverse(); // most recent first
    var html;
    if (!list.length){
      html = '<span class="item"><em>AWAITING FIRST BITE</em> — event begins Thanksgiving Day</span>' +
             '<span class="item">Athlete is carb-loading and emotionally preparing</span>' +
             '<span class="item">Stretchy pants confirmed</span>';
    } else {
      html = list.map(function(e){
        return '<span class="item"><i>'+esc(ago(e.time))+'</i>'+esc(e.dish)+' <em>+'+fmt(e.cal)+' cal</em></span>';
      }).join('');
    }
    track.innerHTML = html + html; // duplicated for seamless loop
    var w = Math.max(30, Math.min(120, (list.length||3) * 8));
    track.style.setProperty('--dur', w + 's');
  }

  render(); renderTicker();
  setInterval(function(){ var c = document.getElementById('cd'); if (c) c.innerHTML = countdownText(); }, 30000);

})();
</script>
</body>
</html>
